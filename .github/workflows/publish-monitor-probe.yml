name: Publish monitor notification probe (no deployment)
run-name: Publish monitor probe — ${{ inputs.outcome }}
on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Deliberate isolated notification test; never publishes content
        type: choice
        options: [failure, success, sha-mismatch, artifact-mode]
        default: failure
        required: true
permissions:
  contents: read
  actions: read
jobs:
  notification-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Isolated outcome (never a deployment)
        env:
          PROBE_OUTCOME: ${{ inputs.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = artifact-mode ] || [ "$PROBE_OUTCOME" = sha-mismatch ]; then
            test "$GITHUB_REF" = refs/heads/probe/compressed-release-2026-10-30 || { echo 'Probe branch required'; exit 1; }
          fi
          if [ "$PROBE_OUTCOME" = failure ]; then
            echo 'Deliberate non-production publish-monitor alert test.'
            exit 1
          fi
          echo 'Non-production monitor probe succeeded; this is not a live content publish.'
      - name: Prove a submitted SHA is not a deployed release (read-only hosted probe)
        if: inputs.outcome == 'sha-mismatch'
        env:
          SUBMITTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const response = await fetch('https://app.chasingmajors.com/data/v1/checklists/index.json?probe=' + process.env.GITHUB_RUN_ID, {signal: AbortSignal.timeout(20000), cache: 'no-store'});
            assert(response.ok, 'Live index is unavailable; cannot infer deployment');
            const live = await response.json();
            assert.match(live.release_sha || '', /^[a-f0-9]{40}$/, 'Live source-SHA evidence missing');
            assert.notEqual(live.release_sha, process.env.SUBMITTED_SHA, 'Use an unpublished probe branch to test mismatched SHA');
            console.log(JSON.stringify({probe_only:true, submitted_sha:process.env.SUBMITTED_SHA, observed_live_source_sha:live.release_sha, release_verified:false, result:'correctly_unverified', http:response.status}));
          })().catch(error => {console.error(error.message); process.exitCode = 1;});
          NODE
      - uses: actions/checkout@v4
        if: inputs.outcome == 'artifact-mode'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.outcome == 'artifact-mode'
        with:
          node-version: '24'
      - name: Build actual compressed artifact locally on runner (no Pages upload/deploy)
        if: inputs.outcome == 'artifact-mode'
        env:
          CM_QUERY_WORK: ${{ runner.temp }}/cm-query
          CM_QUERY_DIRECTORY: ${{ runner.temp }}/cm-query/derived
          TMPDIR: ${{ runner.temp }}
          SQLITE_TMPDIR: ${{ runner.temp }}
        run: |
          node scripts/content-release.cjs validate
          node scripts/search-query/build.cjs
          node scripts/search-query/grams.cjs
          node scripts/search-query/artifact.cjs stamp . "$CM_QUERY_DIRECTORY"
          printf '[]' > "$RUNNER_TEMP/required-products.json"
          export CM_RELEASE_BUILD_TIME=$(git show -s --format=%cI "$GITHUB_SHA")
          node --max-old-space-size=4096 scripts/content-release.cjs assemble "$RUNNER_TEMP/cm-probe-site" "$RUNNER_TEMP/required-products.json"
      - name: Upload only the real small release manifest
        if: inputs.outcome == 'artifact-mode'
        uses: actions/upload-artifact@v4
        with:
          name: content-release-manifest
          path: ${{ runner.temp }}/cm-probe-site/data/publish-release.json
          retention-days: 7
      - name: Exercise staged monitor against real GitHub ZIP and live mismatched release
        if: inputs.outcome == 'artifact-mode'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node .github/probes/artifact-monitor.cjs
