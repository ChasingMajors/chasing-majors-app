name: Refresh reviewed checklists and Vault data
on:
  push:
    branches: [main]
    paths: ['data/v1/manifest.json', 'data/v1/vault/**', 'data/v1/checklists/**', 'data/cv-reviewed-imports/**', 'shared/**', 'scripts/**', 'data/prv-calculations/**', 'data/prv-checklist-sizes.json', 'data/prv-integrity-reviews.json', 'data/prv-cv-identity-policy.json', 'tests/**', 'vault/**', 'checklists/**', '.github/workflows/vault-data.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: vault-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            data/recent.json
            data/recent-state.json
            data/v1/manifest.json
            data/v1/vault
            data/v1/checklists
            data/cv-reviewed-imports
            data/v2/vault
            data/prv-calculations
            data/prv-checklist-sizes.json
            data/prv-integrity-reviews.json
            data/prv-cv-identity-policy.json
            shared
            scripts
            tests
            ChatBot
            vault
            checklists
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Build and publish derived data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-reviewed-checklists.cjs
            node scripts/build-vault-data.cjs
            node scripts/stamp-publish-release.cjs "$(git rev-parse HEAD)"
            git add data/v1/checklists data/v1/manifest.json data/v1/vault/index.json data/v2/vault data/recent.json data/recent-state.json
            if git diff --cached --quiet; then
              # No derived-data change (e.g. a frontend-only push to checklists/ or vault/).
              # The new static assets are already on main; Pages still needs a build to serve them.
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
            git commit -m 'Refresh structured Vault data'
            if git push origin HEAD:main; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
          done
          exit 1
      - name: Audit CV and PRV identity review candidates
        run: node scripts/audit-card-identities.cjs /tmp/card-identity-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: card-identity-audit
          path: /tmp/card-identity-audit.json
          retention-days: 14
