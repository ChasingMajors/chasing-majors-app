name: Refresh structured Vault data
on:
  push:
    branches: [main]
    paths: ['data/v1/manifest.json', 'data/v1/vault/**', 'data/v1/checklists/index.json', 'shared/vault-model.js', 'scripts/**', 'data/prv-calculations/**', 'tests/**', 'vault/**', '.github/workflows/vault-data.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: vault-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/v1/manifest.json
            data/v1/vault
            data/v1/checklists/index.json
            data/v2/vault
            data/prv-calculations
            shared
            scripts
            tests
            vault
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Build and publish derived data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-vault-data.cjs
            git add data/v2/vault
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh structured Vault data'
            if git push origin HEAD:main; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
          done
          exit 1
