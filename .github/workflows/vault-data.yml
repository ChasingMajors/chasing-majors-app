name: Refresh reviewed checklists and Vault data
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_codes:
        description: Comma-separated submitted product codes; asserted before and after deploy
        type: string
        default: ''
      mode:
        description: Probes are non-production only
        type: choice
        options: [normal, validation-failure-probe]
        default: normal
permissions:
  contents: read
concurrency:
  group: cm-content-release
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Pin source and expected product codes
        env:
          CM_EXPECTED_CODES: ${{ inputs.expected_codes }}
          CM_BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "${PROBE_MODE:-normal}" != normal ]; then
            echo 'Failure probes cannot run on the production branch.'
            exit 1
          fi
          echo "CM_RELEASE_BUILD_TIME=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          node scripts/ensure-release-history.cjs
          node scripts/content-release.cjs expected "$RUNNER_TEMP/required-products.json"
      - name: Validate source, exact identities and payload references
        env:
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PROBE_MODE" = validation-failure-probe ]; then
            node scripts/content-release.cjs validate --probe-invalid
          else
            node scripts/content-release.cjs validate
          fi
      - name: Deterministically rebuild complete indexes and v2
        run: node scripts/build-content-release.cjs
      - name: Fingerprint complete bounded-search inputs
        id: search-inputs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/recovery/canonical-runtime.cjs
        run: node scripts/search-query/reuse.cjs key "$RUNNER_TEMP/search-inputs.json"
      - name: Restore exact bounded-search candidate
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cm-search-cache
          key: ${{ steps.search-inputs.outputs.key }}
      - name: Build complete memory-bounded search directory or verify exact reuse (offline SQLite, never D1)
        env:
          TMPDIR: ${{ runner.temp }}
          SQLITE_TMPDIR: ${{ runner.temp }}
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/recovery/canonical-runtime.cjs
        run: node scripts/search-query/reuse.cjs run "$RUNNER_TEMP/cm-query" "$RUNNER_TEMP/cm-search-cache"
      - name: Content regression tests (blocking)
        run: node --test tests/*.test.cjs
      - name: CSP generator regression tests (blocking)
        run: python3 -m unittest discover -s tests -p test_csp_policy.py
      - name: Validate rebuilt release
        run: node scripts/content-release.cjs validate
      - name: Assemble one immutable Pages artifact (size guarded)
        env:
          CM_QUERY_DIRECTORY: ${{ runner.temp }}/cm-query/derived
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/recovery/canonical-runtime.cjs
        run: node scripts/content-release.cjs assemble "$RUNNER_TEMP/cm-site" "$RUNNER_TEMP/required-products.json"
      - name: Generate CSP hashes from the exact assembled HTML (proposal only)
        run: python3 scripts/csp-policy.py --root "$RUNNER_TEMP/cm-site" --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/csp-policy.json"
      - name: Upload SHA-bound CSP proposal for the deployment compatibility guard
        uses: actions/upload-artifact@v4
        with:
          name: csp-policy
          path: ${{ runner.temp }}/csp-policy.json
          retention-days: 7
      - name: Prepare qualified search cache after all blocking checks
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/recovery/canonical-runtime.cjs
        run: node scripts/search-query/reuse.cjs save "$RUNNER_TEMP/cm-query" "$RUNNER_TEMP/cm-search-cache"
      - name: Save qualified bounded-search cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cm-search-cache
          key: ${{ steps.search-inputs.outputs.key }}
      - name: Upload search reuse evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-reuse-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/search-inputs.json
            ${{ runner.temp }}/cm-query/reuse-result.json
            ${{ runner.temp }}/cm-query/receipt.json
      - name: Upload small SHA-bound manifest for the operator monitor
        uses: actions/upload-artifact@v4
        with:
          name: content-release-manifest
          path: ${{ runner.temp }}/cm-site/data/publish-release.json
          retention-days: 7
      - name: Upload exact validated artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/cm-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      page_url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/csp-policy-guard.cjs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: csp-policy
          path: ${{ runner.temp }}/csp-policy
      - name: Reject an obsolete source before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA" || { echo 'Superseded release rejected; no deployment requested.'; exit 1; }
      - name: Reject HTML incompatible with any active enforcing CSP (read-only)
        run: node scripts/csp-policy-guard.cjs "$RUNNER_TEMP/csp-policy/csp-policy.json" "$RUNNER_TEMP/csp-preflight.json"
      - name: Preserve CSP compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csp-preflight
          path: ${{ runner.temp }}/csp-preflight.json
          retention-days: 7
      - name: Deploy the immutable artifact
        id: pages
        uses: actions/deploy-pages@v4
  verify:
    needs: [refresh, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/content-release.cjs
            /scripts/production-verification-url.cjs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify live SHA, new codes, counts, parallels and hashes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir "$RUNNER_TEMP/cm-verify"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/cm-verify" ./data/publish-release.json
          verified_url=$(node scripts/production-verification-url.cjs "$PAGE_URL")
          for attempt in 1 2 3 4 5; do
            if node scripts/content-release.cjs verify "$verified_url" "$RUNNER_TEMP/cm-verify/data/publish-release.json"; then exit 0; fi
            sleep 20
          done
          exit 1
